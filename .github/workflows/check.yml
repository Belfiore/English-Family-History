# On a pull request: check the data, build the site with the engine and run the checks in tests/ against
# the build, without publishing anything.
name: Check a pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  site:
    uses: Belfiore/family-site-engine/.github/workflows/build-site.yml@v1.2.0
    with:
      deploy: false
      site-tests: |
        node tests/verify-canvas.js
        node tests/verify-map.js
        node tests/verify-archive.js
