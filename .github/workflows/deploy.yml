# Builds the site with the family site engine and publishes it to GitHub Pages.
#
# The engine (the family tree, the family map, Stuart and the navigation bar) lives in
# Belfiore/family-site-engine. This site takes the engine version its channel points to (engine.channel in
# site.config.json); the engine tells the site when that changes. The data is checked, the site is built,
# and the checks in tests/ run against the build before anything is published. If any step fails, nothing
# is published and the live site stays as it was.
#
# To roll back: Actions > Build and publish the site > Run workflow, with the engine version that last worked.
name: Build and publish the site

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [engine-release]
  workflow_dispatch:
    inputs:
      engine-version:
        description: Build with this engine version instead of the channel (for example 1.0.0, to roll back). Leave empty to follow the channel.
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    uses: Belfiore/family-site-engine/.github/workflows/build-site.yml@v1
    with:
      engine-version: ${{ inputs.engine-version || '' }}
      site-tests: |
        node tests/verify-canvas.js
        node tests/verify-map.js
        node tests/verify-archive.js
